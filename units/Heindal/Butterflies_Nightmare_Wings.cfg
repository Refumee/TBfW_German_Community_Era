#textdomain wesnoth-fluffy-era
[unit_type]
    id=Nightmare Wings
    name= _ "Nightmare Wings"
    race=monster
    image="units/animals/butterfly_swarm.png~CS(-100,-100,-100)"
    hitpoints=28
	movement_type=smallfly
    movement=5
    experience=96
    level=2
    alignment=chaotic
    advances_to=null
    cost=30
    usage=scout
    description= _ "Imagine it is dark night and you are attacked by a swarm. First they just swarm you, it tickles. Then they start to bite and devour, thousands of little teeth. These are no longer the peaceful butterflies, but a pack of fearsome beasts corrupted by dark magic."
    {DEFENSE_ANIM "units/animals/butterfly_swarm.png~CS(-100,-100,-100)" "units/animals/butterfly_swarm.png~CS(-100,-100,-100)" {SOUND_LIST:HUMAN_HIT} }
    die_sound={SOUND_LIST:HUMAN_DIE}
    undead_variation=mounted
	
    [abilities]
		{ABILITY_REGENERATES}
		{ABILITY_DISTRACT}
		{ABILITY_FEEDING}
    [/abilities]

	[attack]
        name=darkness
        description= _ "darkness"
        type=arcane
        range=melee
        damage=2
        number=7
        icon=attacks/wail.png
        [specials]
			{WEAPON_SPECIAL_SWARM}
        [/specials]
    [/attack]  
	
	[attack]
        name=thousand bites
        description= _ "thousand bites"
        type=pierce
        range=melee
        damage=2
        number=7
        icon=attacks/pincers.png
        [specials]
			{WEAPON_SPECIAL_SWARM}
        [/specials]
    [/attack]  
    
[/unit_type]
