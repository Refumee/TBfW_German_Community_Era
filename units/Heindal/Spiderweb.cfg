#textdomain wesnoth-fluffy-era
[unit_type]
    id=Web Spider
    name= _ "Web Spider"
    race=monsters
    image="units/monsters/spider_small.png~CS(0,0,50)"
    hitpoints=25
    movement_type=woodland
    [movement_costs]
        fungus=2
    [/movement_costs]
    movement=6
    experience=90
    level=2
    alignment=neutral
    advances_to=Webber Spider
    cost=25
    usage=scout
    description= _ "Spiders in the deepth of the forest can grow to an enormous size. Some more experienced spiders can throw nets on unware adventurers or other kinds of prey."
    die_sound=hiss-big.wav
    {DEFENSE_ANIM "units/monsters/spider_small_melee2.png~CS(0,0,50)" "units/monsters/spider_small_melee1.png~CS(0,0,50)" hiss.wav }
    [attack]
        name=fangs
        description=_"fangs"
        icon=attacks/fangs-spider.png
        type=blade
        range=melee
        damage=4
        number=3
    [/attack]
	[attack]
        name=web
        description=_"web"
        icon=attacks/fangs-spider.png
        type=impact
        range=range
        damage=12
        number=1
        [specials]
			{WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
    [attack_anim]
        start_time=-400
        [filter_attack]
            name=fangs
        [/filter_attack]
        [frame]
            duration=50
            image="units/monsters/spider_small_melee1.png~CS(0,0,50)"
        [/frame]
        [frame]
            duration=50
            image="units/monsters/spider_small_melee2.png~CS(0,0,50)"
        [/frame]
        [frame]
            duration=50
            image="units/monsters/spider_small_melee3.png~CS(0,0,50)"
        [/frame]
        [frame]
            duration=50
            image="units/monsters/spider_small_melee2.png~CS(0,0,50)"
        [/frame]
        [frame]
            duration=50
            image="units/monsters/spider_small_melee1.png~CS(0,0,50)"
        [/frame]
    [/attack_anim]
	[attack_anim]
        [filter_attack]
            name=web
        [/filter_attack]
        [missile_frame]
            begin=-150
            end=0
            image="projectiles/web.png"
            image_diagonal="projectiles/web.png"
        [/missile_frame]
        [if]
            hits=yes
            [frame]
                begin=-350
                end=-100
                sound=throw-1.wav
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                begin=-350
                end=-100
                sound=throw-2.wav
            [/frame]
        [/else]
    [/attack_anim]
	
[/unit_type]
