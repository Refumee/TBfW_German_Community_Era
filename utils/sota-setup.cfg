# general macro animations for the Soulless GCE and advancements
#define UNIT_BODY_SOULLESS_GRAPHICS_GCE BASE_NAME
	image="units/undead/{BASE_NAME}.png"
	{DEFENSE_ANIM "units/undead/{BASE_NAME}-defend.png" "units/undead/{BASE_NAME}.png" {SOUND_LIST:ZOMBIE_HIT} }
	[death]
		start_time=0
		[frame]
			image="units/undead/{BASE_NAME}-die-[1~4].png:150,units/undead/soulless-die-[5~10].png:150"
		[/frame]
	[/death]
	[attack_anim]
		[filter_attack]
			name=touch
		[/filter_attack]
		direction=s
		start_time=-200
		[frame]
			image="units/undead/{BASE_NAME}-attack-s.png:400"
			sound=zombie-attack.wav
		[/frame]
	[/attack_anim]
	[attack_anim]
		[filter_attack]
			name=touch
		[/filter_attack]
		direction=n
		start_time=-200
		[frame]
			image="units/undead/{BASE_NAME}-attack-n.png:400"
			sound=zombie-attack.wav
		[/frame]
	[/attack_anim]
	[attack_anim]
		[filter_attack]
			name=touch
		[/filter_attack]
		direction=se,sw,ne,nw
		start_time=-200
		[frame]
			image="units/undead/{BASE_NAME}-attack.png:400"
			sound=zombie-attack.wav
		[/frame]
	[/attack_anim]
#enddef

